<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料 - 競賽咖</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/utilities.css">
    
    <style>
        body {
            background: #f8f9fa;
        }

        .page-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .profile-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
        }

        /* 側邊欄 */
        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .profile-avatar {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #eee;
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 16px;
            position: relative;
        }

        .avatar-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
        }

        .avatar-upload {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 36px;
            height: 36px;
            background: white;
            border-radius: 50%;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .avatar-upload:hover {
            background: #667eea;
            color: white;
        }

        .profile-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .profile-email {
            font-size: 14px;
            color: #666;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-menu li {
            margin-bottom: 4px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #666;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: #f0f4ff;
            color: #667eea;
        }

        .sidebar-menu i {
            width: 20px;
            text-align: center;
        }

        /* 主要內容 */
        .main-content {
            background: white;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .content-header {
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 2px solid #f3f4f6;
        }

        .content-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .content-subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            font-size: 14px;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            padding-top: 20px;
            border-top: 1px solid #f3f4f6;
        }

        @media (max-width: 768px) {
            .profile-layout {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">
                    <div class="logo-icon">B</div>
                    <div class="logo-text">
                        <div class="logo-title">競賽咖</div>
                        <div class="logo-subtitle">BSaiLa</div>
                    </div>
                </a>
                <nav class="nav">
                    <a href="index.html">首頁</a>
                    <a href="cups-list.html">賽事列表</a>
                    <a href="my-registrations.html">我的報名</a>
                </nav>
                <div class="user-menu">
                    <a href="profile.html" class="active"><i class="fas fa-user"></i> 會員中心</a>
                    <a href="#"><i class="fas fa-sign-out-alt"></i> 登出</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="page-container">
        <div class="profile-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="profile-avatar">
                    <div class="avatar-wrapper">
                        <div class="avatar-image">王</div>
                        <div class="avatar-upload">
                            <i class="fas fa-camera"></i>
                        </div>
                    </div>
                    <div class="profile-name">王小明</div>
                    <div class="profile-email">wang@email.com</div>
                </div>

                <ul class="sidebar-menu">
                    <li><a href="profile.html" class="active"><i class="fas fa-user"></i> 個人資料</a></li>
                    <li><a href="my-registrations.html"><i class="fas fa-clipboard-list"></i> 報名記錄</a></li>
                    <li><a href="my-cups.html"><i class="fas fa-trophy"></i> 我的盃賽</a></li>
                    <li><a href="my-favorites.html"><i class="fas fa-heart"></i> 我的收藏</a></li>
                    <li><a href="my-teams.html"><i class="fas fa-users"></i> 我的隊伍</a></li>
                    <li><a href="#" style="color: #ef4444;"><i class="fas fa-sign-out-alt"></i> 登出</a></li>
                </ul>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div class="content-header">
                    <h1 class="content-title">個人資料</h1>
                    <p class="content-subtitle">管理您的個人基本資訊</p>
                </div>

                <!-- 基本資料 -->
                <form id="profileForm">
                    <div class="form-section">
                        <h3 class="section-title">基本資料</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>姓名 <span class="required">*</span></label>
                                <input type="text" value="王小明" required>
                            </div>
                            <div class="form-group">
                                <label>性別</label>
                                <select>
                                    <option value="male">男性</option>
                                    <option value="female">女性</option>
                                    <option value="other">其他</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>出生日期</label>
                                <input type="date" value="1990-01-01">
                            </div>
                            <div class="form-group">
                                <label>身分證字號</label>
                                <input type="text" value="A123456789" placeholder="請輸入身分證字號">
                            </div>
                            <div class="form-group">
                                <label>聯絡電話 <span class="required">*</span></label>
                                <input type="tel" value="0912-345-678" required>
                            </div>
                            <div class="form-group">
                                <label>Email <span class="required">*</span></label>
                                <input type="email" value="wang@email.com" required>
                            </div>
                        </div>
                    </div>

                    <!-- 表單操作 -->
                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary">
                            <i class="fas fa-times"></i> 取消
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> 儲存變更
                        </button>
                    </div>
                </form>
            </main>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 競賽咖 BSaiLa. All rights reserved.</p>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/navigation.js"></script>
    <script>
        // 表單提交
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('儲存個人資料');
            alert('個人資料已更新！');
        });

        // 頭像上傳
        document.querySelector('.avatar-upload').addEventListener('click', function() {
            console.log('上傳頭像');
            alert('頭像上傳功能（需要後端支援）');
        });
    </script>
</body>
</html>
