<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立新隊伍 - 競賽咖</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/utilities.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-input);
            color: #333;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Main Card */
        .main-card {
            background: white;
            border-radius: 10px;
            padding: 40px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }

        .card-title {
            font-size: 28px;
            color: var(--text);
            margin-bottom: 10px;
        }

        .card-subtitle {
            color: var(--text-secondary);
            margin-bottom: 30px;
        }

        /* Form Sections */
        .form-section {
            margin-bottom: 35px;
        }

        .section-title {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary);
        }

        /* Form Groups */
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: #555;
        }

        .form-group label .required {
            color: #dc3545;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 5px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-help {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
        }

        /* Team Members Section */
        .members-list {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            background: var(--bg-input);
        }

        .member-item {
            background: white;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .member-info h4 {
            color: var(--text);
            margin-bottom: 5px;
        }

        .member-info p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .btn-remove {
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-remove:hover {
            background: #c82333;
        }

        .btn-add-member {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }

        .btn-add-member:hover {
            background: #218838;
        }

        /* Upload Section */
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: #f8f9ff;
        }

        .upload-area i {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .upload-area p {
            color: var(--text-secondary);
        }

        .file-input {
            display: none;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 40px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-back {
            background: #6c757d;
            color: white;
        }

        .btn-back:hover {
            background: #5a6268;
        }

        .btn-next {
            background: var(--primary);
            color: white;
        }

        .btn-next:hover {
            background: var(--primary-hover);
        }

        /* Footer */
        .footer {
            background: var(--text);
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 60px;
        }

        .alert {
            padding: 15px;
            background: #d1ecf1;
            border: 1px solid #bee5eb;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert i {
            color: #0c5460;
            margin-top: 2px;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <img src="../images/logo.svg" alt="競賽咖" class="logo-img">
            </a>
            <nav class="nav">
                <a href="index.html" class="nav-link">首頁</a>
                <a href="cups-list.html" class="nav-link">賽事列表</a>
            </nav>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Main Card -->
        <div class="main-card">
            <h1 class="card-title">建立新隊伍</h1>
            <p class="card-subtitle">填寫隊伍資料以報名參加：2026 春季籃球聯賽</p>

            <div class="alert">
                <i class="fas fa-info-circle"></i>
                <div>
                    <strong>注意事項：</strong><br>
                    請填寫隊伍名稱、隊長姓名及聯絡信箱，隊員資料可於報名後再補充。
                </div>
            </div>

            <form id="teamForm">
                <!-- Basic Info Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-info-circle"></i>
                        基本資料
                    </h3>
                    <div class="form-group">
                        <label>隊伍名稱 <span class="required">*</span></label>
                        <input type="text" name="teamName" placeholder="請輸入隊伍名稱" required>
                    </div>
                    <div class="form-group">
                        <label>隊長姓名 <span class="required">*</span></label>
                        <input type="text" name="captainName" placeholder="請輸入隊長姓名" required>
                    </div>
                    <div class="form-group">
                        <label>聯絡信箱 <span class="required">*</span></label>
                        <input type="email" name="email" placeholder="example@email.com" required>
                    </div>
                </div>

                <!-- Team Members Section -->
                <div class="form-section">
                    <h3 class="section-title">
                        <i class="fas fa-users"></i>
                        隊員名單
                    </h3>
                    <div class="members-list">
                        <div class="member-item">
                            <div class="member-info">
                                <h4>1. 張小明 (隊長)</h4>
                                <p><i class="fas fa-envelope"></i> captain@example.com</p>
                            </div>
                        </div>
                        <div class="member-item">
                            <div class="member-info">
                                <h4>2. 李小華</h4>
                                <p><i class="fas fa-envelope"></i> member2@example.com</p>
                            </div>
                            <button type="button" class="btn-remove">
                                <i class="fas fa-times"></i> 移除
                            </button>
                        </div>
                        <button type="button" class="btn-add-member" onclick="addMember()">
                            <i class="fas fa-plus"></i> 新增隊員
                        </button>
                    </div>
                </div>

                <!-- Button Group -->
                <div class="button-group">
                    <button type="button" class="btn btn-back" onclick="window.location.href='signup-step1.html'">
                        <i class="fas fa-arrow-left"></i> 返回上一步
                    </button>
                    <button type="submit" class="btn btn-next">
                        下一步：確認資料 <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>&copy; 2026 競賽咖 Basaila. All rights reserved.</p>
    </div>

    <script>
        let memberCount = 2;

        document.getElementById('teamForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Validate form data
            const teamName = document.querySelector('input[name="teamName"]').value;
            const captainName = document.querySelector('input[name="captainName"]').value;
            const email = document.querySelector('input[name="email"]').value;
            
            if (teamName && captainName && email) {
                window.location.href = 'signup-step2.html?new=true';
            }
        });

        // Add new member
        function addMember() {
            const name = prompt('請輸入隊員姓名：');
            if (!name) return;
            
            const email = prompt('請輸入隊員信箱：');
            if (!email) return;
            
            memberCount++;
            const membersList = document.querySelector('.members-list');
            const addButton = membersList.querySelector('.btn-add-member');
            
            const newMember = document.createElement('div');
            newMember.className = 'member-item';
            newMember.innerHTML = `
                <div class="member-info">
                    <h4>${memberCount}. ${name}</h4>
                    <p><i class="fas fa-envelope"></i> ${email}</p>
                </div>
                <button type="button" class="btn-remove" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i> 移除
                </button>
            `;
            
            membersList.insertBefore(newMember, addButton);
        }

        // Handle remove buttons
        document.querySelectorAll('.btn-remove').forEach(btn => {
            btn.addEventListener('click', function() {
                this.parentElement.remove();
            });
        });
    </script>
</body>
</html>
